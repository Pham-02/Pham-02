name: Generate snake
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#3b82f6&color_dots=#f1e4ec,#f7c1d9,#ef8fb7,#dc4a85,#a8174f
            dist/github-snake-dark.svg?color_snake=#60a5fa&color_dots=#241629,#5a2147,#8c2a63,#d03a7d,#ff6ba8
      - uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
